# Política de migración para los tests de MigrateStorageClass con USB.
#
# Umbral bajo (500µs) porque el disco USB lento sí supera esa latencia de I/O,
# mientras que el NVMe no. Destino: fast-nvme (StorageClass sobre el NVMe).
# Se aplica a los pods víctima con app=victim, saturation-type=io.
apiVersion: autoremediation.tfg.local/v1alpha1
kind: IORemediationPolicy
metadata:
  name: e2e-migrate
  namespace: default
spec:
  targetPodSelector:
    matchLabels:
      app: victim
      saturation-type: io
  prometheusEndpoint: "http://localhost:9090"
  metricType: "IO"
  evaluationWindow: "30s"
  latencyThreshold: "500us"
  action: "MigrateStorageClass"
  migrateStorageConfig:
    targetStorageClass: "fast-nvme"

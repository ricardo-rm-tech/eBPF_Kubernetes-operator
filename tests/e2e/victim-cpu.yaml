# Pod víctima que satura la CPU para disparar la métrica ebpf_cpu_runq_latency_ns_total.
# Se le da un límite bajo (200m) para que con 4 workers se sature rápidamente
# y el operator pueda escalarlo verticalmente hasta el MaxCPULimit configurado.
apiVersion: v1
kind: Pod
metadata:
  name: victim-cpu
  namespace: default
  labels:
    app: victim
    saturation-type: cpu
spec:
  restartPolicy: Never
  # Tolera el taint que aplica el operator (EvictAndTaint). Así el pod víctima
  # se puede programar aunque un escenario anterior haya dejado el nodo con el
  # taint autoremediation.tfg.local/saturation:NoSchedule. Elimina las carreras
  # de timing entre escenarios (el operator puede re-aplicar el taint tras
  # borrar la policy, pero ya no bloquea la programación de los pods del test).
  tolerations:
  - key: "autoremediation.tfg.local/saturation"
    operator: "Exists"
    effect: "NoSchedule"
  containers:
  - name: stress
    image: polinux/stress-ng:latest
    args: ["--cpu", "4", "--cpu-method", "matrixprod", "--timeout", "600s"]
    resources:
      requests:
        cpu: "100m"
        memory: "64Mi"
      limits:
        cpu: "200m"   # Límite bajo a propósito → run queue se saturará
        memory: "128Mi"

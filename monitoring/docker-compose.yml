# Grafana auto-provisionado para el TFG.
#
# Lee del Prometheus que arranca `start_system yes` (proceso en el host, :9090).
# Por eso usa network_mode: host (Linux): dentro del contenedor, localhost == host.
#
# Uso:
#   cd ~/tfg/monitoring && docker compose up -d
#   (si docker pide grupo) sg docker -c 'cd ~/tfg/monitoring && docker compose up -d'
#
# Grafana queda en http://localhost:3000  (admin / admin)
services:
  grafana:
    image: grafana/grafana-oss:11.6.0
    container_name: tfg-grafana
    restart: unless-stopped
    network_mode: host
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SERVER_HTTP_PORT=3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - tfg-grafana-data:/var/lib/grafana

volumes:
  tfg-grafana-data:

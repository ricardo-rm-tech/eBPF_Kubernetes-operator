apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # Prometheus corre como proceso en el host (start_system yes).
    # Grafana usa network_mode: host, así que localhost apunta al host.
    url: http://localhost:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "5s"
